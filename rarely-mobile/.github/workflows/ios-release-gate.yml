name: RARELY iOS Release Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rarely-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rarely-mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/validate-store-submission.mjs
        working-directory: ../rarely-ios-submission-pack-v2
      - run: node scripts/generate-release-report.mjs
        working-directory: ../rarely-ios-submission-pack-v2
